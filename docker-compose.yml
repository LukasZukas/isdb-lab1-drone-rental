# Two independent PostgreSQL DBMS instances (DBVS1, DBVS2), a one-shot
# builder that creates all fragments, and pgAdmin with both servers registered.
#
#   docker compose up -d          -> build everything, pgAdmin on http://localhost:5050
#   docker compose run --rm setup -> rebuild / reset all databases
name: isdb-lab1

services:
  dbvs1:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [dbvs1-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  dbvs2:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5434:5432"]
    volumes: [dbvs2-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  setup:
    image: postgres:17
    depends_on:
      dbvs1: { condition: service_healthy }
      dbvs2: { condition: service_healthy }
    environment:
      PGUSER: postgres
      PGPASSWORD: postgres
      KEEP_ORIGINAL: ${KEEP_ORIGINAL:-0}
    volumes:
      - ./sql:/work/sql:ro
      - ./scripts:/work/scripts:ro
    entrypoint: ["bash", "/work/scripts/build.sh"]
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:latest
    depends_on: [dbvs1, dbvs2]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ENABLE_SERVER_PASS_EXEC_CMD: "True"
    ports: ["5050:80"]
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./sql:/home/sql:ro   # Query Tool -> Open File -> /home/sql

volumes:
  dbvs1-data:
  dbvs2-data:
